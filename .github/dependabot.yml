version: 2
updates:
  - package-ecosystem: pub
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Actualiza"
  - package-ecosystem: gradle
    directory: /android
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Actualiza"
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "Actualiza"
