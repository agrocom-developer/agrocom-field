name: Version

# Workflow manual: el dueño decide explícitamente cuándo una versión candidata
# se versionea. No es automático en cada merge a master — ver ADR 0007.
on:
  workflow_dispatch:
    inputs:
      bump-type:
        description: 'Tipo de bump de versión'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

jobs:
  version:
    name: Bump version and create tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Necesita todo el historial para calcular versionCode correctamente
          fetch-depth: 0
          ref: master

      - name: Configurar git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      - name: Leer pubspec.yaml
        id: current
        run: |
          VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versión actual: $VERSION"

      - name: Ejecutar bump-version.sh
        id: bump
        run: |
          chmod +x ./bin/bump-version.sh
          NEW_VERSION=$(./bin/bump-version.sh "${{ github.event.inputs.bump-type }}")
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Versión nueva: $NEW_VERSION"

      - name: Verificar cambios en pubspec.yaml
        run: |
          git status
          git diff pubspec.yaml

      - name: Crear commit
        run: |
          git add pubspec.yaml
          git commit -m "Agrega versión ${{ steps.bump.outputs.new_version }}"

      - name: Crear tag
        run: |
          git tag "${{ steps.bump.outputs.new_version }}"
          git show "${{ steps.bump.outputs.new_version }}"

      - name: Pushear commit y tag
        run: |
          git push origin master
          git push origin "${{ steps.bump.outputs.new_version }}"

      - name: Resumen
        run: |
          echo "## Versionado completado"
          echo ""
          echo "- Versión anterior: ${{ steps.current.outputs.version }}"
          echo "- Versión nueva: ${{ steps.bump.outputs.new_version }}"
          echo "- Tipo de bump: ${{ github.event.inputs.bump-type }}"
          echo "- Tag creado: ${{ steps.bump.outputs.new_version }}"
          echo ""
          echo "Commit: $GITHUB_REPOSITORY@master"
