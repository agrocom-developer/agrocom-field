name: agrocom_field
description: "App de campo de Agrocom SRL — offline-first, flavors piloto/auxiliar"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  bloc: ^9.2.1
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  decimal: ^3.2.6
  dio: ^5.11.1
  drift: ">=2.30.0 <2.35.0"
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.0
  flutter_secure_storage: ^11.1.0
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  image_picker: ^1.2.1
  json_annotation: ^4.12.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  torch_light: ^1.1.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  bloc_test: ^10.0.0
  flutter_image_compress_common: ^1.1.1
  flutter_launcher_icons: ^0.14.4
  image_picker_platform_interface: ^2.11.1
  mocktail: ^1.0.5
  sqlite3: ^3.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/imagenes/

# Ícono del launcher (ambos flavors comparten marca, se genera una sola vez
# en android/app/src/main/res — ninguno de los dos flavors tiene res propio
# que lo sobreescriba). Isotipo recortado del logo completo
# (assets/imagenes/agrocom_logo.png): solo la "A" con la señal, sin el
# wordmark "AGROCOM", porque un ícono de 48dp con texto no se lee. Regenerar
# con `dart run flutter_launcher_icons` si el logo cambia.
flutter_launcher_icons:
  android: true
  image_path: assets/icono_launcher/icono.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icono_launcher/icono_foreground.png
  min_sdk_android: 29
