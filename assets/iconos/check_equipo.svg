<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Planilla de equipo con el check de aprobado como insignia. Un solo
       color: `IconoAgrocom` lo retiñe entero con `ColorFilter` (srcIn), así
       que ningún trazo depende de un segundo color para distinguirse. -->
  <rect x="5" y="3" width="14" height="18" rx="2"
        stroke="#101418" stroke-width="1.6"/>
  <rect x="9" y="1.6" width="6" height="2.6" rx="1" fill="#101418"/>
  <path d="M8 9 L14 9 M8 12.5 L14 12.5"
        stroke="#101418" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="16" cy="17" r="4.2" stroke="#101418" stroke-width="1.5"/>
  <path d="M14.2 17 L15.6 18.4 L18 15.6"
        stroke="#101418" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
