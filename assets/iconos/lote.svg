  <circle cx="14" cy="4" r="1.3" fill="#101418"/>
  <circle cx="20" cy="10" r="1.3" fill="#101418"/>
  <circle cx="16" cy="20" r="1.3" fill="#101418"/>
  <circle cx="6" cy="18" r="1.3" fill="#101418"/>
</svg>
